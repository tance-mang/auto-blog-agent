name: Guardian schedule check
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  check:
    if: vars.GUARDIAN_WATCH_WORKFLOW != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tance-mang/workflow-guardian@161433281586c7463f25efacef189c2ab82ca285 # v1
        with:
          mode: schedule
          watch-workflow: ${{ vars.GUARDIAN_WATCH_WORKFLOW }}
          max-age-minutes: ${{ vars.GUARDIAN_MAX_AGE_MINUTES || '180' }}
          notify: ${{ vars.GUARDIAN_EMAIL_ENABLED == 'true' && 'email' || 'none' }}
        env:
          SMTP_HOST: ${{ secrets.GUARDIAN_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.GUARDIAN_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.GUARDIAN_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.GUARDIAN_SMTP_FROM }}
          SMTP_TO: ${{ secrets.GUARDIAN_SMTP_TO }}
