name: Workflow Guardian
on:
  workflow_run:
    workflows: [Auto blog, Guardian drill]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure' ||
       github.event.workflow_run.conclusion == 'action_required' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'stale')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m autoblog.guardian
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: incident-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: incident.md
          retention-days: 14
      - name: Send incident email
        if: vars.GUARDIAN_EMAIL_ENABLED == 'true' && github.event.workflow_run.name != 'Guardian drill'
        run: python -m autoblog.guardian
        env:
          GUARDIAN_SEND_MAIL: '1'
          SMTP_HOST: ${{ secrets.GUARDIAN_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.GUARDIAN_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.GUARDIAN_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.GUARDIAN_SMTP_FROM }}
          SMTP_TO: ${{ secrets.GUARDIAN_SMTP_TO }}
