name: Workflow Guardian
on:
  workflow_run:
    workflows: [Auto blog, Guardian drill]
    types: [completed]
permissions:
  actions: read
concurrency:
  group: guardian-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure' ||
       github.event.workflow_run.conclusion == 'action_required' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'stale')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tance-mang/workflow-guardian@161433281586c7463f25efacef189c2ab82ca285 # v1
        with:
          profile: blog
          notify: ${{ vars.GUARDIAN_EMAIL_ENABLED == 'true' && github.event.workflow_run.name != 'Guardian drill' && 'email' || 'none' }}
        env:
          GUARDIAN_AI_KEY: ${{ secrets.GUARDIAN_AI_KEY }}
          GUARDIAN_AI_MODEL: ${{ vars.GUARDIAN_AI_MODEL }}
          SMTP_HOST: ${{ secrets.GUARDIAN_SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.GUARDIAN_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.GUARDIAN_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.GUARDIAN_SMTP_FROM }}
          SMTP_TO: ${{ secrets.GUARDIAN_SMTP_TO }}
