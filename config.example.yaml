# Sample for the owner's static site: https://tance-mang.github.io/
# This file is documentation. The program reads config.yaml, not this file.
# Copy the blog values you want into config.yaml. Leave enabled false until a
# local dry run looks right. Set AI_API_KEY and BLOG_TOKEN in the environment.
# Do not paste tokens into this file or into config.yaml.
mode: safe
language:
  content: zh-CN
timezone: Asia/Shanghai
publish_hour: 9
enabled: false
feeds:
  - https://github.com/python/cpython/releases.atom
allowed_hosts: [github.com, docs.python.org, www.python.org]
keywords: [Python, AI, API, agent, automation]
writer_model: ''
reviewer_model: ''
max_output_tokens: 3000
daily_token_limit: 30000
daily_budget_usd: 0.20
input_usd_per_million: 1.0
output_usd_per_million: 4.0
imports:
  path: private/imports
  project: ''
  since: ''
  until: ''
  keywords: []
blog:
  repository: tance-mang/tance-mang.github.io
  branch: main
  format: tance-html
  section: create
  posts_path: ''
  layout: post
